<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <!-- Concept B: Isometric 3D cone with a tangent plane patch.
       The cone is rendered as a soft isometric solid, with an
       elliptical base (perspective) and a small parallelogram
       indicating the tangent plane at a marked optimum.
       Suggests the geometry of the cone surface and the local
       linear sensitivity diffcp computes. -->
  <defs>
    <linearGradient id="coneShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#312E81"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#FBBF24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hex frame: thin charcoal, round-joined -->
  <polygon points="600,260 450,0 150,0 0,260 150,520 450,520"
           fill="#FFFFFF" stroke="#1A1A1A" stroke-width="6"
           stroke-linejoin="round"/>

  <!-- Apex (top) -->
  <!-- Apex point: (300, 110); base ellipse center: (300, 380) -->

  <!-- Cone solid: triangle from apex to ellipse extrema, gradient-shaded -->
  <path d="M 300 110
           L 145 380
           A 155 38 0 0 0 455 380
           Z"
        fill="url(#coneShade)"/>

  <!-- Front edges of the base ellipse (visible arc) -->
  <path d="M 145 380 A 155 38 0 0 0 455 380"
        fill="none" stroke="#1A1A1A" stroke-width="2"
        stroke-linecap="round"/>
  <!-- Back edge of the base ellipse (dashed = behind cone) -->
  <path d="M 145 380 A 155 38 0 0 1 455 380"
        fill="none" stroke="#1A1A1A" stroke-width="1.4"
        stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Cone slant edges -->
  <line x1="300" y1="110" x2="145" y2="380" stroke="#1A1A1A"
        stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="110" x2="455" y2="380" stroke="#1A1A1A"
        stroke-width="2" stroke-linecap="round"/>

  <!-- Optimum point on the front-right slant, with soft glow halo -->
  <ellipse cx="375" cy="240" rx="32" ry="32" fill="url(#dotGlow)"/>
  <circle cx="375" cy="240" r="9" fill="#FBBF24" stroke="#1A1A1A"
          stroke-width="1.5"/>

  <!-- Tangent plane: a small parallelogram tangent to the slant at the dot -->
  <polygon points="335,205 415,235 415,275 335,245"
           fill="none" stroke="#0EA5A4" stroke-width="2.2"
           stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="300" y="475" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="44" fill="#1A1A1A"
        letter-spacing="3">diffcp</text>
</svg>
